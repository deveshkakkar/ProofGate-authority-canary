[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofgate-canary-owner-issuer"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyJWT[crypto]==2.15.1"]

[tool.setuptools]
packages = ["issuer"]

[tool.setuptools.package-data]
issuer = ["*.json", "*.md", "*.in"]
